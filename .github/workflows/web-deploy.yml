name: Build & deploy web (wasm)

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: write   # required to push to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        run: |
          emcc --version
          cmake --version
          ninja --version

      - name: Configure (emcmake)
        run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web

      - name: Stage site
        run: |
          mkdir -p _site
          cp build-web/SolarSystemGL.html  _site/index.html
          cp build-web/SolarSystemGL.js    _site/
          cp build-web/SolarSystemGL.wasm  _site/
          cp build-web/SolarSystemGL.data  _site/
          ls -la _site/

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ./_site
          publish_branch: gh-pages
          force_orphan: true
