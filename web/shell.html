<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <title>SolarSystemGL</title>
    <style>
        :root {
            --bg:       #000;
            --fg:       #c8d0e0;
            --accent:   #66b3ff;
            --dim:      #6a778e;
            --panel:    rgba(8, 12, 22, 0.92);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* dvh sizes against the dynamic viewport — keeps the canvas full-
               height on iOS Safari when the URL bar auto-collapses. */
            height: 100dvh;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
                         system-ui, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            background: #000;
            outline: none;
            cursor: default;
            /* Suppress browser default touch gestures (pinch-zoom, double-tap
               zoom, pan-to-scroll). All gesture handling is in C++. */
            touch-action: none;
        }

        #status {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: var(--bg);
            z-index: 10;
            transition: opacity 0.4s ease 0.2s;
        }
        #status.hidden { opacity: 0; pointer-events: none; }

        #status .title    { font-size: 28px; color: var(--fg);   letter-spacing: 0.05em; margin-bottom: 4px; }
        #status .subtitle { font-size: 14px; color: var(--dim);  margin-bottom: 28px; }
        #status .message  { font-size: 13px; color: var(--dim);  margin-top: 18px; }

        #progress {
            width: 260px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.25s ease;
        }

        #error {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel);
            color: #ffb0b0;
            padding: 18px 22px;
            border-radius: 6px;
            font-size: 13px;
            max-width: 520px;
            display: none;
            border: 1px solid rgba(255, 80, 80, 0.4);
            z-index: 20;
        }
        #error.visible { display: block; }
        #error h3      { margin: 0 0 8px; color: #ffd5d5; font-size: 14px; }
        #error pre     { margin: 0; white-space: pre-wrap; font-family: ui-monospace, "Consolas", monospace; font-size: 12px; color: #ffb0b0; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="status">
        <div class="title">SolarSystemGL</div>
        <div class="subtitle">An OpenGL N-body sandbox</div>
        <div id="progress"><div id="progress-bar"></div></div>
        <div class="message" id="status-message">Loading…</div>
    </div>

    <div id="error">
        <h3>SolarSystemGL failed to start</h3>
        <pre id="error-detail"></pre>
    </div>

    <script>
        (function() {
            var statusBox       = document.getElementById('status');
            var statusMessage   = document.getElementById('status-message');
            var progressBar     = document.getElementById('progress-bar');
            var errorBox        = document.getElementById('error');
            var errorDetail     = document.getElementById('error-detail');

            function showError(text) {
                statusBox.classList.add('hidden');
                errorBox.classList.add('visible');
                errorDetail.textContent = text;
                console.error(text);
            }

            // Size the backing framebuffer to the viewport (CSS pixels × DPR).
            // The C++ side polls the canvas CSS size each frame via
            // emscripten_get_element_css_size and re-issues glViewport / FBO
            // resize, so just keeping these attributes truthful is enough.
            function resizeCanvas() {
                var canvas = document.getElementById('canvas');
                if (!canvas) return;
                var dpr = window.devicePixelRatio || 1;
                canvas.width  = Math.floor(window.innerWidth  * dpr);
                canvas.height = Math.floor(window.innerHeight * dpr);
            }
            // Sync the size BEFORE the wasm module instantiates so the very
            // first glfwCreateWindow / glViewport already sees the real size.
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('load',   resizeCanvas);

            window.Module = {
                canvas: document.getElementById('canvas'),
                preinitializedWebGLContext: null,

                print:    function(text) { console.log(text); },
                printErr: function(text) { console.warn(text); },

                setStatus: function(text) {
                    // Emscripten reports progress as "Downloading data... (X/Y)".
                    var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
                    if (m) {
                        var pct = (parseFloat(m[1]) / parseFloat(m[3])) * 100;
                        progressBar.style.width = pct.toFixed(1) + '%';
                        statusMessage.textContent = 'Loading data… ' + pct.toFixed(0) + '%';
                    } else if (text) {
                        statusMessage.textContent = text;
                    }
                },

                totalDependencies: 0,
                monitorRunDependencies: function(left) {
                    this.totalDependencies = Math.max(this.totalDependencies, left);
                    if (left === 0) {
                        progressBar.style.width = '100%';
                        statusMessage.textContent = 'Initialising…';
                    }
                },

                onRuntimeInitialized: function() {
                    statusBox.classList.add('hidden');
                    resizeCanvas();
                },

                onAbort: function(what) {
                    showError('Runtime aborted: ' + what);
                }
            };

            window.addEventListener('error', function(e) {
                showError(e.message + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?'));
            });
        })();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
